<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>멍멍 똥줍기</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#7cc46a;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  #hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);font-size:20px}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,60,30,.55)}
  .card{background:#fffaf0;border-radius:20px;padding:28px 32px;max-width:360px;width:calc(100% - 64px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);color:#4a3520}
  .card h1{margin:0 0 6px;font-size:32px}
  .card p{line-height:1.6;margin:10px 0}
  .card button{margin-top:12px;font:inherit;font-size:20px;font-weight:800;padding:12px 34px;border:0;border-radius:999px;background:#ff8a3d;color:#fff;cursor:pointer;box-shadow:0 4px 0 #c75f1c}
  .card button:active{transform:translateY(3px);box-shadow:0 1px 0 #c75f1c}
  .small{font-size:14px;opacity:.75}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">점수 0</span><span id="level">Lv.1</span><span id="lives">❤️❤️❤️</span></div>
<div id="overlay">
  <div class="card" id="card">
    <h1>🐶 멍멍 똥줍기</h1>
    <p>강아지가 간식 🦴을 먹으면<br>잠시 후 똥 💩을 싸요!</p>
    <p>똥 주위의 <b>원이 다 줄어들기 전에</b><br>똥을 눌러서 주워주세요.</p>
    <p><b>강아지를 건드리면 왈! 하고 물어요</b> 💢<br>
    가끔 <b>쉬야</b> 💛도 하니 웅덩이도 닦아주세요!<br>
    쉬야 중엔 예민해서 <span style="color:#e53935">빨간 원</span> 안은 다 위험해요.</p>
    <p>잔디를 누르면 간식을 던져줄 수 있어요.<br>(간식을 줄수록 점수↑ 똥도↑)</p>
    <p class="small">3번 놓치면 게임 오버! · 최고점수 <span id="best">0</span></p>
    <button id="start">시작하기</button>
  </div>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makeGrass();
}
let grass = [];
function makeGrass(){
  grass = [];
  const n = Math.floor(W*H/2500);
  for(let i=0;i<n;i++) grass.push({x:Math.random()*W, y:Math.random()*H, s:3+Math.random()*5});
}
window.addEventListener('resize', resize);
resize();

// ---------- sound ----------
let ac = null;
function beep(freq, dur=0.1, type='square', vol=0.08, slide=0){
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), ac.currentTime+dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}

// ---------- state ----------
const TOP = 50; // HUD space
let state = 'menu';
const DANGER = 54; // 쉬야 중 강아지가 무는 범위
let pees = [];
let score, lives, level, picked, combo, dogs, treats, poops, stains, particles, popups, treatTimer, lastT, shake;
let best = 0;
try{ best = +localStorage.getItem('poopBest') || 0; }catch(e){}
document.getElementById('best').textContent = best;

function cfg(){
  return {
    dogSpeed: 90 + level*14,
    poopLife: Math.max(1.6, 4.2 - level*0.25),
    treatEvery: Math.max(0.9, 2.6 - level*0.17),
    digest: [Math.max(0.6, 2.2 - level*0.12), Math.max(1.2, 3.6 - level*0.18)],
    dogs: level >= 7 ? 3 : level >= 4 ? 2 : 1,
    peeEvery: [Math.max(4, 9 - level*0.5), Math.max(7, 15 - level*0.7)],
  };
}
// 모두 하얀 비숑, 리본 색으로 구분
const DOG_COLORS = [
  {body:'#ffffff', shade:'#ece6dc', ribbon:'#ff6fa3'},
  {body:'#fffdf8', shade:'#efe7da', ribbon:'#5fb8ff'},
  {body:'#ffffff', shade:'#e9e4dd', ribbon:'#ffc93c'},
];
function newDog(i){
  return {x: W*(0.3+0.2*i), y: H*0.6, vx:0, face:1, target:null, wander:{x:W/2,y:H/2}, wanderT:0,
          belly:[], col:DOG_COLORS[i%3], bob:0, eatT:0, squat:0, tail:0,
          pee:0, angry:0, bite:0, peeT:rand(5,9)};
}
function reset(){
  score=0; lives=3; level=1; picked=0; combo=0; shake=0;
  dogs=[newDog(0)]; treats=[]; poops=[]; pees=[]; stains=[]; particles=[]; popups=[];
  treatTimer=0.5; updateHud();
}
function updateHud(){
  document.getElementById('score').textContent = '점수 ' + score + (combo>=3 ? '  🔥x'+combo : '');
  document.getElementById('level').textContent = 'Lv.' + level;
  document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0,lives)) + '🤍'.repeat(3-Math.max(0,lives));
}
const rand=(a,b)=>a+Math.random()*(b-a);
function randPos(){ return {x:rand(40,W-40), y:rand(TOP+40,H-40)}; }

function addTreat(x,y,thrown){
  if(treats.length >= 6) return;
  treats.push({x,y,t:0,drop:thrown?0:1});
}

// ---------- input ----------
cv.addEventListener('pointerdown', e=>{
  if(state!=='play') return;
  const x=e.clientX, y=e.clientY;
  // 강아지를 건드리면 언제든 물림! (쉬야 중/직후엔 빨간 원 전체가 위험)
  for(const d of dogs){
    const touchBody = ((x-(d.x+d.face*8))/34)**2 + ((y-(d.y-10))/26)**2 < 1;
    const inDanger = (d.pee>0||d.angry>0) && Math.hypot(d.x-x,d.y-6-y)<DANGER;
    if(touchBody || inDanger){ dogBite(d,x,y); return; }
  }
  // poop first (bigger hitbox, nearest)
  let bestP=null, bd=1e9;
  for(const p of poops){
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<46 && d<bd){bd=d;bestP=p;}
  }
  if(bestP){ pickPoop(bestP, poops); return; }
  for(const w of pees){
    const d=Math.hypot(w.x-x,(w.y-y)*1.4);
    if(d<Math.max(34,w.r+18) && d<bd){bd=d;bestP=w;}
  }
  if(bestP){ pickPoop(bestP, pees); return; }
  if(y>TOP+10){ addTreat(x,y,true); beep(700,0.06,'triangle',0.05,200); }
});

function dogBite(d,x,y){
  d.bite=0.5; d.face = x>=d.x?1:-1;
  lives--; combo=0; shake=0.45;
  popups.push({x,y:y-20,t:0,txt:'왈! 물렸다 💢',bad:true});
  for(let i=0;i<12;i++) particles.push({x,y,vx:rand(-160,160),vy:rand(-220,-40),t:0,life:0.5,c:'#ff5252'});
  beep(320,0.09,'square',0.1,-120); setTimeout(()=>beep(300,0.12,'square',0.1,-150),110);
  updateHud();
  if(lives<=0) gameOver();
}

function pickPoop(p, arr){
  arr.splice(arr.indexOf(p),1);
  const isPee = arr===pees;
  combo++; picked++;
  const frac = isPee ? 1 - p.age/p.life : 1 - p.age/p.life; // remaining
  const pts = 10 + Math.round(frac*10) + Math.min(combo,10)*2;
  score += pts;
  popups.push({x:p.x,y:p.y-20,t:0,txt:'+'+pts+(isPee?' 쓱싹!':frac>0.7?' 빠름!':'')});
  for(let i=0;i<10;i++) particles.push({x:p.x,y:p.y,vx:rand(-120,120),vy:rand(-200,-40),t:0,life:0.6,c:isPee?'#fff3a0':'#fff'});
  beep(520+Math.min(combo,12)*40,0.09,'square',0.07,300);
  const nl = 1 + Math.floor(picked/8);
  if(nl>level){
    level=nl;
    popups.push({x:W/2,y:H/2,t:0,txt:'레벨 업! Lv.'+level,big:true});
    beep(660,0.12,'triangle',0.08); setTimeout(()=>beep(990,0.18,'triangle',0.08),120);
    while(dogs.length<cfg().dogs) dogs.push(newDog(dogs.length));
  }
  updateHud();
}

function missPoop(p, arr=poops){
  arr.splice(arr.indexOf(p),1);
  stains.push({x:p.x,y:p.y,t:0,pee:arr===pees});
  lives--; combo=0; shake=0.35;
  popups.push({x:p.x,y:p.y-20,t:0,txt:'놓쳤다!',bad:true});
  beep(200,0.35,'sawtooth',0.08,-120);
  updateHud();
  if(lives<=0) gameOver();
}

function gameOver(){
  state='over';
  const nb = score>best;
  if(nb){ best=score; try{localStorage.setItem('poopBest',best);}catch(e){} }
  document.getElementById('card').innerHTML =
    `<h1>💩 게임 오버</h1><p style="font-size:22px">점수 <b>${score}</b>${nb?' 🎉 최고기록!':''}</p>
     <p>주운 똥 ${picked}개 · Lv.${level}</p><p class="small">최고점수 ${best}</p>
     <button id="start">다시 하기</button>`;
  document.getElementById('start').onclick=start;
  document.getElementById('overlay').style.display='flex';
}

function start(){
  reset(); state='play';
  document.getElementById('overlay').style.display='none';
  beep(440,0.08,'triangle',0.06); setTimeout(()=>beep(660,0.1,'triangle',0.06),90);
}
document.getElementById('start').onclick=start;

// ---------- update ----------
function update(dt){
  const c = cfg();
  treatTimer -= dt;
  if(treatTimer<=0){ const p=randPos(); addTreat(p.x,p.y,false); treatTimer=c.treatEvery*rand(0.8,1.2); }
  for(const t of treats){ t.t+=dt; if(t.drop>0) t.drop=Math.max(0,t.drop-dt*3); }

  for(const d of dogs){
    d.tail += dt*(d.target?18:8);
    if(d.bite>0) d.bite-=dt;
    // 쉬야 중: 제자리에 서서 예민함
    if(d.pee>0){
      d.pee-=dt;
      if(d.pee<=0){ d.angry=0.9; }
      continue;
    }
    if(d.angry>0) d.angry-=dt;
    // digest -> poop
    for(let i=d.belly.length-1;i>=0;i--){
      d.belly[i]-=dt;
      if(d.belly[i]<=0 && d.squat<=0){ d.belly.splice(i,1); d.squat=0.45; d.poopPending=true; }
    }
    if(d.squat>0){
      d.squat-=dt;
      if(d.squat<=0 && d.poopPending){
        d.poopPending=false;
        const px = Math.min(W-25,Math.max(25,d.x - d.face*28)), py = Math.min(H-20,d.y+14);
        poops.push({x:px,y:py,age:0,life:c.poopLife,flies:[rand(0,6),rand(0,6)]});
        beep(120,0.15,'sine',0.12,-60);
      }
      continue;
    }
    if(d.eatT>0){ d.eatT-=dt; continue; }
    d.peeT-=dt;
    if(d.peeT<=0){
      d.peeT=rand(c.peeEvery[0],c.peeEvery[1]);
      d.pee=rand(1.6,2.2); d.target=null;
      const px=Math.min(W-25,Math.max(25,d.x - d.face*34)), py=Math.min(H-20,d.y+20);
      pees.push({x:px,y:py,r:0,maxR:rand(17,22),age:0,life:c.poopLife+0.8,ready:false,dog:d});
      beep(900,0.7,'sine',0.025,-500);
      continue;
    }
    // choose target: nearest unclaimed treat
    if(!d.target || !treats.includes(d.target)){
      d.target=null; let bd=1e9;
      for(const t of treats){ if(t.drop>0) continue; if(dogs.some(o=>o!==d&&o.target===t)) continue;
        const dd=Math.hypot(t.x-d.x,t.y-d.y); if(dd<bd){bd=dd;d.target=t;} }
    }
    let gx,gy,sp;
    if(d.target){ gx=d.target.x; gy=d.target.y; sp=c.dogSpeed; }
    else{
      d.wanderT-=dt;
      if(d.wanderT<=0){ d.wander=randPos(); d.wanderT=rand(1.5,3.5); }
      gx=d.wander.x; gy=d.wander.y; sp=c.dogSpeed*0.4;
    }
    const dx=gx-d.x, dy=gy-d.y, dist=Math.hypot(dx,dy);
    if(dist>4){
      const m=Math.min(dist, sp*dt);
      d.x+=dx/dist*m; d.y+=dy/dist*m;
      if(Math.abs(dx)>2) d.face=dx>0?1:-1;
      d.bob+=dt*14;
    }
    if(d.target && dist<14){
      treats.splice(treats.indexOf(d.target),1); d.target=null; d.eatT=0.35;
      d.belly.push(rand(c.digest[0],c.digest[1]));
      score+=2; updateHud();
      beep(900,0.05,'square',0.04); setTimeout(()=>beep(1100,0.05,'square',0.04),60);
    }
  }

  for(let i=poops.length-1;i>=0;i--){ const p=poops[i]; p.age+=dt; if(p.age>=p.life){ missPoop(p); if(state!=='play') return; } }
  for(let i=pees.length-1;i>=0;i--){
    const w=pees[i];
    if(!w.ready){ w.r=Math.min(w.maxR, w.r+dt*16); if(w.dog.pee<=0) w.ready=true; continue; }
    w.r=Math.max(w.r, w.maxR); w.age+=dt;
    if(w.age>=w.life){ missPoop(w, pees); if(state!=='play') return; }
  }
  for(const s of stains) s.t+=dt;
  stains = stains.filter(s=>s.t<6);
  for(const p of particles){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; }
  particles = particles.filter(p=>p.t<p.life);
  for(const p of popups) p.t+=dt;
  popups = popups.filter(p=>p.t<(p.big?1.4:0.9));
  if(shake>0) shake-=dt;
}

// ---------- draw ----------
function drawTreat(t){
  const y = t.y - t.drop*60;
  ctx.save(); ctx.translate(t.x,y); ctx.rotate(Math.sin(t.t*3)*0.15);
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(0,10+t.drop*60,14,4,0,0,7); ctx.fill();
  ctx.fillStyle='#f6e7c8'; ctx.strokeStyle='#b89768'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-11,-3,22,6,3); ctx.fill(); ctx.stroke();
  for(const [x,y] of [[-11,-4],[-11,4],[11,-4],[11,4]]){ ctx.beginPath(); ctx.arc(x,y,4.5,0,7); ctx.fill(); ctx.stroke(); }
  ctx.fillRect(-10,-2.5,20,5);
  ctx.restore();
}

function drawPoop(p, stain){
  ctx.save(); ctx.translate(p.x,p.y);
  if(stain){
    ctx.globalAlpha = Math.max(0,1-p.t/6)*0.8;
    ctx.fillStyle=p.pee?'#b9a43a':'#5e3d1f'; ctx.beginPath(); ctx.ellipse(0,4,22,8,0,0,7); ctx.fill();
    ctx.restore(); return;
  }
  const frac = 1 - p.age/p.life;
  const pop = Math.min(1, p.age*6);
  // timer ring
  ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.arc(0,-6,30,0,7); ctx.stroke();
  const hue = 120*frac;
  ctx.strokeStyle=`hsl(${hue},85%,50%)`;
  ctx.beginPath(); ctx.arc(0,-6,30,-Math.PI/2,-Math.PI/2+Math.PI*2*frac); ctx.stroke();
  // wobble when urgent
  if(frac<0.35) ctx.rotate(Math.sin(p.age*30)*0.08);
  ctx.scale(pop,pop);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0,8,18,5,0,0,7); ctx.fill();
  const g=['#7a4a22','#8d5a2b','#a06a35'];
  [[0,2,17,8],[0,-6,12,7],[0,-13,7,5]].forEach(([x,y,rx,ry],i)=>{
    ctx.fillStyle=g[i]; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill();
  });
  ctx.beginPath(); ctx.moveTo(-2,-17); ctx.quadraticCurveTo(3,-22,1,-24); ctx.lineTo(4,-17); ctx.fill();
  // eyes
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-5,-5,3,0,7); ctx.arc(5,-5,3,0,7); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-5,-4.5,1.5,0,7); ctx.arc(5,-4.5,1.5,0,7); ctx.fill();
  ctx.restore();
  // stink lines + flies
  ctx.save(); ctx.translate(p.x,p.y);
  ctx.strokeStyle='rgba(120,160,60,.7)'; ctx.lineWidth=2;
  for(let i=-1;i<=1;i++){
    const o=(p.age*30+i*10)%30;
    ctx.globalAlpha=1-o/30;
    ctx.beginPath(); ctx.moveTo(i*9,-28-o); ctx.quadraticCurveTo(i*9+5,-33-o,i*9,-38-o); ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(frac<0.5){
    ctx.fillStyle='#222';
    for(const f of p.flies){ const a=p.age*8+f; ctx.beginPath(); ctx.arc(Math.cos(a)*22,-14+Math.sin(a*1.7)*10,2.2,0,7); ctx.fill(); }
  }
  ctx.restore();
}

function drawPee(w){
  ctx.save(); ctx.translate(w.x,w.y);
  ctx.fillStyle='rgba(245,214,40,.6)';
  ctx.beginPath(); ctx.ellipse(0,0,w.r,w.r*0.45,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w.r*0.7,w.r*0.15,w.r*0.35,w.r*0.2,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-w.r*0.3,-w.r*0.12,w.r*0.3,w.r*0.09,0,0,7); ctx.fill();
  if(w.ready){
    const frac=1-w.age/w.life;
    ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.arc(0,0,30,0,7); ctx.stroke();
    ctx.strokeStyle=`hsl(${120*frac},85%,50%)`;
    ctx.beginPath(); ctx.arc(0,0,30,-Math.PI/2,-Math.PI/2+Math.PI*2*frac); ctx.stroke();
  }
  ctx.restore();
}

function drawDog(d){
  const squat = d.squat>0, peeing = d.pee>0;
  const bob = squat||peeing?0:Math.abs(Math.sin(d.bob))*3;
  // 위험 구역 (쉬야 중/직후)
  if(peeing||d.angry>0){
    const t=performance.now()/1000;
    ctx.save(); ctx.translate(d.x,d.y-6);
    ctx.fillStyle=`rgba(229,57,53,${0.12+0.06*Math.sin(t*10)})`;
    ctx.beginPath(); ctx.arc(0,0,DANGER,0,7); ctx.fill();
    ctx.setLineDash([8,6]); ctx.lineDashOffset=-t*30;
    ctx.strokeStyle='rgba(229,57,53,.85)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,DANGER,0,7); ctx.stroke();
    ctx.restore();
  }
  ctx.save(); ctx.translate(d.x,d.y);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0,20,30,7,0,0,7); ctx.fill();
  ctx.scale(d.face,1); ctx.translate(0,-bob + (squat?4:0));
  const b=d.col.body, sh=d.col.shade, OUT='#cfc6b8';
  // 몽글몽글한 털 뭉치: 바깥선 → 그림자 → 흰 털 순서로 겹쳐 그림
  const fluff=(cx,cy,rx,ry,n,pr)=>{
    const pts=[];
    for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; pts.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
    ctx.fillStyle=OUT;
    for(const [x,y] of pts){ ctx.beginPath(); ctx.arc(x,y,pr+1.6,0,7); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(cx,cy,rx+1.6,ry+1.6,0,0,7); ctx.fill();
    ctx.fillStyle=sh;
    for(const [x,y] of pts){ ctx.beginPath(); ctx.arc(x,y,pr,0,7); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,7); ctx.fill();
    ctx.fillStyle=b;
    for(const [x,y] of pts){ ctx.beginPath(); ctx.arc(x-1,y-1.5,pr*0.8,0,7); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(cx-1,cy-2,rx,ry,0,0,7); ctx.fill();
  };
  // legs (짧고 복슬복슬)
  const lp = squat?0:Math.sin(d.bob)*4;
  for(const [x,o] of [[-16,lp],[-6,-lp],[10,-lp],[19,lp]]){
    if(peeing && x===-16) continue; // 들어올린 뒷다리는 따로
    const len = squat&&x<0?6:12;
    fluff(x+o, 6+len/2, 3, len/2, 6, 4);
  }
  // tail: 위로 말린 폼폼 꼬리
  ctx.save(); ctx.translate(-24,-6); ctx.rotate(Math.sin(d.tail)*0.4);
  fluff(-2,-8,4,4,7,5);
  ctx.restore();
  // body
  ctx.save(); if(squat) ctx.rotate(-0.25);
  fluff(0,-2,22,12,14,7);
  ctx.restore();
  if(peeing){
    // 옆으로 번쩍 든 뒷다리
    ctx.save(); ctx.translate(-14,2); ctx.rotate(-0.55);
    fluff(-10,0,8,3.5,7,4.5);
    ctx.restore();
    // 쉬야 줄기 → 웅덩이
    const t=performance.now()/1000;
    ctx.save(); ctx.strokeStyle='rgba(250,200,20,.95)'; ctx.lineWidth=3.5; ctx.lineCap='round';
    ctx.setLineDash([6,4]); ctx.lineDashOffset=-t*70;
    ctx.beginPath(); ctx.moveTo(-18,8); ctx.quadraticCurveTo(-40,2,-34,20); ctx.stroke();
    ctx.restore();
  }
  // head (비숑 특유의 동그란 솜사탕 머리)
  ctx.save(); ctx.translate(22, squat?-24:-18);
  if(d.bite>0) ctx.translate(Math.sin(d.bite*40)*3+8, 4);
  if(d.eatT>0) ctx.translate(4,Math.abs(Math.sin(d.eatT*30))*6+6);
  // ear (머리 옆으로 늘어진 털)
  fluff(-4,6,4,7,7,5);
  fluff(2,-2,14,13,13,6.5);
  // muzzle
  ctx.fillStyle=OUT; ctx.beginPath(); ctx.ellipse(13,6,8.5,7,0,0,7); ctx.fill();
  ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(12.5,5.5,7.5,6,0,0,7); ctx.fill();
  // nose
  ctx.fillStyle='#1d1612'; ctx.beginPath(); ctx.ellipse(18,3,3.4,2.8,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(17,2,1,0,7); ctx.fill();
  // eyes (까맣고 동글동글)
  if(d.bite>0 || peeing || d.angry>0){
    // 화난 눈썹 + 눈
    ctx.fillStyle='#1d1612'; ctx.beginPath(); ctx.arc(6,-1,3,0,7); ctx.fill();
    ctx.strokeStyle='#1d1612'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(1,-8); ctx.lineTo(10,-4); ctx.stroke();
    if(d.bite>0){ // 벌린 입 + 이빨
      ctx.fillStyle='#7a1f2b'; ctx.beginPath(); ctx.ellipse(14,10,5,4,0,0,7); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath();
      ctx.moveTo(10,7); ctx.lineTo(12,10); ctx.lineTo(14,7); ctx.lineTo(16,10); ctx.lineTo(18,7); ctx.fill();
    }
  } else if(squat){
    ctx.strokeStyle='#1d1612'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(3,-4); ctx.lineTo(9,-1.5); ctx.moveTo(3,1); ctx.lineTo(9,-1.5); ctx.stroke();
  } else {
    ctx.fillStyle='#1d1612'; ctx.beginPath(); ctx.arc(6,-2,3.2,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(7,-3.2,1.1,0,7); ctx.fill();
  }
  // blush
  ctx.fillStyle='rgba(255,140,160,.35)'; ctx.beginPath(); ctx.ellipse(4,6,3.5,2,0,0,7); ctx.fill();
  // tongue
  if(d.target||d.eatT>0){ ctx.fillStyle='#ff7a8a'; ctx.beginPath(); ctx.ellipse(14,12,2.6,4,0.3,0,7); ctx.fill(); }
  // ribbon
  ctx.save(); ctx.translate(-2,-15); ctx.fillStyle=d.col.ribbon;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-8,-5); ctx.lineTo(-8,5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(8,-5); ctx.lineTo(8,5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,2.6,0,7); ctx.fill();
  ctx.restore();
  ctx.restore();
  ctx.restore();
  // indicators
  const label=(txt,col)=>{
    ctx.font='bold 16px "Malgun Gothic",sans-serif'; ctx.textAlign='center'; ctx.fillStyle=col;
    ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=3;
    ctx.strokeText(txt,d.x,d.y-48); ctx.fillText(txt,d.x,d.y-48);
  };
  if(d.bite>0) label('왈왈! 💢','#ff5252');
  else if(peeing) label('쉬야 중… 건드리지 마! 💢','#ffe14d');
  else if(d.angry>0) label('으르릉… 💢','#ff8a80');
  else if(squat){
    ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff';
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=3;
    ctx.strokeText('끄응…',d.x,d.y-44); ctx.fillText('끄응…',d.x,d.y-44);
  } else if(d.belly.length){
    ctx.font='16px sans-serif'; ctx.textAlign='center';
    ctx.fillText('💭'.repeat(1)+'💩'.repeat(Math.min(3,d.belly.length)), d.x, d.y-42);
  }
}

function draw(){
  ctx.save();
  if(shake>0) ctx.translate(rand(-6,6)*shake*3, rand(-6,6)*shake*3);
  ctx.fillStyle='#7cc46a'; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle='#6ab258'; ctx.lineWidth=2;
  for(const g of grass){ ctx.beginPath(); ctx.moveTo(g.x,g.y); ctx.lineTo(g.x-2,g.y-g.s); ctx.moveTo(g.x,g.y); ctx.lineTo(g.x+2,g.y-g.s); ctx.stroke(); }
  if(state==='menu'){ ctx.restore(); return; }
  for(const s of stains) drawPoop(s,true);
  for(const w of pees) drawPee(w);
  for(const t of treats) drawTreat(t);
  // depth sort
  const items=[...poops.map(p=>({y:p.y,f:()=>drawPoop(p)})), ...dogs.map(d=>({y:d.y+20,f:()=>drawDog(d)}))];
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  for(const p of particles){ ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  for(const p of popups){
    const a = 1 - p.t/(p.big?1.4:0.9);
    ctx.globalAlpha=Math.max(0,a);
    ctx.font = `900 ${p.big?40:20}px "Malgun Gothic",sans-serif`; ctx.textAlign='center';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.45)';
    ctx.fillStyle = p.bad?'#ff5252':p.big?'#ffe14d':'#fff';
    const y = p.y - p.t*40;
    ctx.strokeText(p.txt,p.x,y); ctx.fillText(p.txt,p.x,y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function loop(t){
  const dt = Math.min(0.05, (t-(lastT||t))/1000); lastT=t;
  if(state==='play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
